; Luminos ESP32 firmware build environments.
[platformio]
src_dir = .
default_envs = wearable, lantern

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
lib_deps =
  z3t0/IRremote@4.4.1

[env:wearable]
build_flags = -DLUMINOS_WEARABLE
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit MPU6050@2.2.6
  adafruit/Adafruit Unified Sensor@1.1.15
  adafruit/Adafruit BusIO@1.17.2

[env:lantern]
build_flags = -DLUMINOS_LANTERN
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit NeoPixel@1.12.5

[env:dashboard]
build_src_filter = +<dashboard.cpp>
lib_deps =

[env:ir_transmitter]
build_src_filter = +<ir_transmitter.cpp>

[env:ir_receiver]
build_src_filter = +<ir_receiver.cpp>
